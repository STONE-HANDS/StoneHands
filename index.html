<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STONE HANDS — 30 дней</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px}
  .brand{font-weight:800;letter-spacing:.12em;font-size:14px;color:#c6ff3d;text-align:center}
  .hide{display:none!important}
  /* главная */
  h1{margin:4px 0 0;font-size:30px;text-align:center;letter-spacing:.06em}
  .sub{text-align:center;color:#aaa;margin:0}
  .prog{height:10px;background:#222;border-radius:6px;overflow:hidden}
  .prog i{display:block;height:100%;background:#c6ff3d;width:0}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .day{aspect-ratio:1/1;border-radius:16px;border:2px solid #333;background:#111;color:#fff;font-size:20px;font-weight:700;display:grid;place-items:center;cursor:pointer;position:relative}
  .day.done{background:#c6ff3d;color:#000;border-color:#c6ff3d}
  .day.cur{border-color:#c6ff3d}
  .day.lock{opacity:.35}
  .big{background:#c6ff3d;color:#000;border:0;border-radius:28px;padding:18px;font-size:20px;font-weight:800;cursor:pointer;width:100%}
  .ghost{background:none;border:2px solid #444;color:#fff;border-radius:28px;padding:14px;font-size:16px;cursor:pointer;width:100%}
  /* обзор дня */
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:#111;border-radius:16px;padding:14px 16px}
  .item b{display:block;font-size:17px}.item span{color:#999;font-size:14px}
  /* тренировка */
  .card{position:relative;background:#fff;border-radius:24px;aspect-ratio:1/1;overflow:hidden;color:#000}
  .bar{position:absolute;left:0;top:0;height:6px;background:#c6ff3d;width:0;transition:width .3s}
  .meta{position:absolute;top:16px;left:20px;right:20px;display:flex;justify-content:space-between;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .card svg{position:absolute;inset:0;width:100%;height:100%}
  .title{text-align:center;font-size:24px;font-weight:700;margin-top:4px}
  .hint{text-align:center;color:#9a9a9a;font-size:15px;min-height:20px}
  .timer{text-align:center;font-size:84px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .ctrl{margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:#999;border-radius:32px;height:76px;padding:0 24px;position:relative;overflow:hidden}
  .ctrl .fill{position:absolute;left:0;top:0;bottom:0;background:#c6ff3d;width:0;transition:width .3s}
  .ctrl button{position:relative;background:none;border:0;color:#000;width:64px;height:64px;font-size:34px;cursor:pointer;display:grid;place-items:center}
  .ctrl button:disabled{opacity:.3}
  .center{text-align:center}
  @keyframes squeeze{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
  @keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .a-squeeze{transform-origin:50% 55%;animation:squeeze 1.6s ease-in-out infinite}
  .a-spin{transform-origin:50% 62%;animation:spin 4s linear infinite}
  .a-wave{transform-origin:50% 85%;animation:wave 1.8s ease-in-out infinite}
  .f1{animation:tap 1s ease-in-out infinite}.f2{animation:tap 1s .15s ease-in-out infinite}
  .f3{animation:tap 1s .3s ease-in-out infinite}.f4{animation:tap 1s .45s ease-in-out infinite}
  .paused *{animation-play-state:paused!important}
</style>
</head>
<body>
<div class="app">
  <div class="brand">STONE HANDS</div>

  <!-- ГЛАВНАЯ -->
  <section id="home" class="app" style="padding:0;min-height:0">
    <h1>30 ДНЕЙ</h1>
    <p class="sub" id="homeSub"></p>
    <div class="prog"><i id="homeProg"></i></div>
    <div class="grid" id="grid"></div>
    <button class="big" id="todayBtn">Начать</button>
  </section>

  <!-- ОБЗОР ДНЯ -->
  <section id="preview" class="app hide" style="padding:0;min-height:0">
    <h1 id="pvTitle"></h1>
    <p class="sub" id="pvSub"></p>
    <div class="list" id="pvList"></div>
    <button class="big" id="pvGo">Поехали</button>
    <button class="ghost" id="pvBack">Назад</button>
  </section>

  <!-- ТРЕНИРОВКА -->
  <section id="work" class="app hide" style="padding:0;min-height:0">
    <div class="card" id="card">
      <div class="bar" id="bar"></div>
      <div class="meta"><span id="elapsed">00:00</span><span id="count">1/6</span></div>
      <div id="art"></div>
    </div>
    <div class="title" id="title"></div>
    <div class="hint center" id="hint"></div>
    <div class="timer" id="timer">00:40</div>
    <div class="ctrl" id="ctrl">
      <div class="fill" id="fill"></div>
      <button id="prev" aria-label="Назад">&#8249;</button>
      <button id="pp" aria-label="Пауза">❚❚</button>
      <button id="next" aria-label="Вперёд">&#8250;</button>
    </div>
    <button class="ghost" id="quit">Выйти</button>
  </section>

  <!-- ГОТОВО -->
  <section id="finish" class="app hide center" style="padding:40px 0;min-height:0">
    <h1>День выполнен! 💪</h1>
    <p class="sub" id="finSub"></p>
    <button class="big" id="finHome">К списку дней</button>
  </section>
</div>

<script>
const skin="#f4c7a8", line="#000", W=4;
const palm=(x)=>`<g stroke="${line}" stroke-width="${W}" stroke-linejoin="round" stroke-linecap="round" fill="${skin}">${x}</g>`;
const handOpen=(cls)=>`<g class="${cls||""}">`+palm(`
  <rect x="170" y="250" width="170" height="160" rx="40"/>
  <rect x="165" y="110" width="30" height="160" rx="15"/><rect x="200" y="85" width="30" height="185" rx="15"/>
  <rect x="235" y="80" width="30" height="190" rx="15"/><rect x="270" y="95" width="30" height="175" rx="15"/>
  <rect x="305" y="130" width="30" height="140" rx="15" transform="rotate(8 320 270)"/>
  <rect x="120" y="230" width="30" height="110" rx="15" transform="rotate(-48 135 285)"/>`)+`</g>`;
const ART={
 fist:`<g class="a-squeeze">`+palm(`
  <rect x="140" y="170" width="220" height="190" rx="48"/>
  <rect x="150" y="130" width="46" height="70" rx="23"/><rect x="200" y="122" width="46" height="78" rx="23"/>
  <rect x="250" y="122" width="46" height="78" rx="23"/><rect x="300" y="130" width="46" height="70" rx="23"/>
  <path d="M150 260 Q100 250 110 210 Q125 190 150 215"/>
  <rect x="165" y="355" width="170" height="60" rx="20"/>`)+`</g>`,
 open:handOpen("a-squeeze"),
 spin:`<g class="a-spin">`+handOpen("")+`</g>`,
 piano:`<g>`+palm(`<rect x="150" y="260" width="200" height="140" rx="36"/>
  <rect class="f1" x="152" y="140" width="34" height="140" rx="17"/><rect class="f2" x="196" y="125" width="34" height="155" rx="17"/>
  <rect class="f3" x="240" y="125" width="34" height="155" rx="17"/><rect class="f4" x="284" y="140" width="34" height="140" rx="17"/>`)+`</g>`,
 pinch:`<g>`+palm(`<rect x="160" y="260" width="190" height="150" rx="40"/>
  <path d="M190 260 Q200 150 260 140 Q300 140 290 175 Q270 180 250 200 Q240 240 240 262Z"/>
  <path d="M250 262 Q250 200 290 175 Q320 185 305 215 Q290 240 290 262Z"/>
  <rect x="305" y="190" width="30" height="90" rx="15"/><rect x="335" y="215" width="28" height="70" rx="14"/>`)+`</g>`,
 wrist:`<g class="a-wave">`+palm(`<rect x="205" y="300" width="90" height="140" rx="30"/>`)+handOpen("")+`</g>`
};
// Пул из 30 упражнений
const POOL=[
 ["Сжатие кулака","Сильно сожмите и разожмите","fist"],
 ["Раскрытие ладони","Растопырьте пальцы как можно шире","open"],
 ["Круги кистью","Медленно вращайте кистями","spin"],
 ["Пальцы-пианино","По очереди поднимайте пальцы","piano"],
 ["Щепотка","Соединяйте большой палец с каждым","pinch"],
 ["Растяжка запястья","Плавно качайте кистью вверх-вниз","wrist"],
 ["Медленный кулак","Сжимайте 5 секунд, отпускайте 5","fist"],
 ["Веер пальцев","Разведите пальцы и удерживайте","open"],
 ["Вращение по часовой","Большие круги кистью","spin"],
 ["Волна пальцами","Плавная волна от мизинца к большому","piano"],
 ["Большой — мизинец","Касайтесь большим мизинца","pinch"],
 ["Сгибание кисти","Вверх и вниз без рывков","wrist"],
 ["Быстрые кулаки","Быстро сжимайте и разжимайте","fist"],
 ["Растяжка пальцев","Мягко тяните пальцы назад","open"],
 ["Круги против часовой","Вращайте в другую сторону","spin"],
 ["Печать в воздухе","Как будто печатаете на клавиатуре","piano"],
 ["Щипок двумя пальцами","Большой и указательный, с усилием","pinch"],
 ["Встряхивание кистей","Расслабьте и встряхните руки","wrist"],
 ["Кулак с паузой","Сожмите и держите 10 секунд","fist"],
 ["Ладонь к ладони","Прижмите ладони и надавите","open"],
 ["Восьмёрка кистью","Рисуйте кистью восьмёрку","spin"],
 ["Прыжки пальцев","Быстро постукивайте пальцами","piano"],
 ["Кольцо из пальцев","Делайте «ОК» по очереди","pinch"],
 ["Растяжка «молитва»","Ладони вместе, опускайте локти","wrist"],
 ["Сжатие с усилием","Максимум силы, без боли","fist"],
 ["Ладонь и кулак","Чередуйте раскрытие и сжатие","open"],
 ["Вращение двумя кистями","Обе кисти по кругу вместе","spin"],
 ["Пальцы-лесенка","Поднимайте пальцы по одному","piano"],
 ["Быстрая щепотка","Быстро щипайте каждым пальцем","pinch"],
 ["Растяжка предплечья","Тяните ладонь на себя другой рукой","wrist"]
];
function dayPlan(d){ // d = 1..30
  const arr=[];
  for(let k=0;k<6;k++){const p=POOL[((d-1)+k*5)%30];arr.push({t:p[0],h:p[1],a:p[2]});}
  return arr;
}
function durFor(d){return d<=10?40:(d<=20?50:60);}

// сохранение прогресса
let done=[];
try{done=JSON.parse(localStorage.getItem("sh_done")||"[]");}catch(e){done=[];}
function saveDone(){try{localStorage.setItem("sh_done",JSON.stringify(done));}catch(e){}}
function nextDay(){for(let d=1;d<=30;d++){if(done.indexOf(d)<0)return d;}return 30;}

const $=id=>document.getElementById(id);
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function show(id){["home","preview","work","finish"].forEach(x=>$(x).classList.toggle("hide",x!==id));window.scrollTo(0,0);}

// ГЛАВНАЯ
function renderHome(){
  const g=$("grid");g.innerHTML="";
  const cur=nextDay();
  for(let d=1;d<=30;d++){
    const b=document.createElement("button");
    b.className="day"+(done.indexOf(d)>=0?" done":"")+(d===cur&&done.length<30?" cur":"");
    b.textContent=done.indexOf(d)>=0?"✓":d;
    b.addEventListener("click",()=>openDay(d));
    g.appendChild(b);
  }
  $("homeSub").textContent="Выполнено: "+done.length+" из 30";
  $("homeProg").style.width=(done.length/30*100)+"%";
  $("todayBtn").textContent=done.length>=30?"Все дни пройдены! Повторить":"Начать день "+cur;
  show("home");
}
$("todayBtn").addEventListener("click",()=>openDay(done.length>=30?1:nextDay()));

// ОБЗОР ДНЯ
let curDay=1,plan=[],DUR=40;
function openDay(d){
  curDay=d;plan=dayPlan(d);DUR=durFor(d);
  $("pvTitle").textContent="День "+d;
  $("pvSub").textContent="6 упражнений по "+DUR+" секунд (~"+Math.round(6*DUR/60)+" мин)";
  $("pvList").innerHTML=plan.map((e,i)=>`<div class="item"><b>${i+1}. ${e.t}</b><span>${e.h}</span></div>`).join("");
  show("preview");
}
$("pvBack").addEventListener("click",renderHome);
$("pvGo").addEventListener("click",startWorkout);

// ТРЕНИРОВКА
let i=0,left=0,total=0,running=false,tick=null;
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.25);}catch(e){}}
function renderEx(){
  const e=plan[i];
  $("art").innerHTML='<svg viewBox="0 0 500 500">'+ART[e.a]+'</svg>';
  $("title").textContent=e.t;$("hint").textContent=e.h;
  $("count").textContent=(i+1)+"/"+plan.length;
  $("prev").disabled=i===0;
  $("fill").style.width=(i/plan.length*100)+"%";
  paint();
}
function paint(){
  $("timer").textContent=fmt(left);
  $("elapsed").textContent=fmt(total);
  $("bar").style.width=((DUR-left)/DUR*100)+"%";
  $("pp").textContent=running?"❚❚":"▶";
  $("card").classList.toggle("paused",!running);
}
function goTo(n){
  if(n<0)return;
  if(n>=plan.length){finishDay();return;}
  i=n;left=DUR;renderEx();
}
function finishDay(){
  running=false;clearInterval(tick);
  if(done.indexOf(curDay)<0){done.push(curDay);saveDone();}
  $("finSub").textContent="Выполнено дней: "+done.length+" из 30";
  show("finish");
}
function startWorkout(){
  i=0;left=DUR;total=0;running=true;
  show("work");renderEx();
  clearInterval(tick);
  tick=setInterval(()=>{
    if(!running)return;
    left--;total++;
    if(left<=0){beep();goTo(i+1);return;}
    paint();
  },1000);
}
$("pp").addEventListener("click",()=>{running=!running;paint();});
$("next").addEventListener("click",()=>{beep();goTo(i+1);});
$("prev").addEventListener("click",()=>goTo(i-1));
$("quit").addEventListener("click",()=>{running=false;clearInterval(tick);renderHome();});
$("finHome").addEventListener("click",renderHome);

renderHome();
</script>
</body>
</html>
